<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>Призовой лототрон</title>

  <style>
    :root {
      --bg: #f6f4ef;
      --card: rgba(255, 255, 255, 0.9);
      --text: #171717;
      --muted: #6f6f6f;
      --line: #dedbd2;
      --accent: #89c8b8;
      --accent-dark: #367f70;
      --pink: #ef4e96;
      --danger: #c73333;
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: Inter, Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(137, 200, 184, 0.34), transparent 30%),
        radial-gradient(circle at 88% 84%, rgba(239, 78, 150, 0.18), transparent 25%),
        var(--bg);
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      min-height: 100vh;
      padding: 24px;
      display: none;
      place-items: center;
      animation: fadeIn 0.35s ease;
    }

    .screen.active {
      display: grid;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    .setup-card {
      width: min(920px, 100%);
      padding: 34px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 30px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 12px;
      font-size: clamp(38px, 6vw, 72px);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    .subtitle {
      max-width: 650px;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.55;
    }

    .add-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-bottom: 20px;
    }

    .number-input {
      min-width: 0;
      padding: 17px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      outline: none;
      background: white;
      font-size: 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .number-input:focus {
      border-color: var(--accent-dark);
      box-shadow: 0 0 0 5px rgba(137, 200, 184, 0.25);
    }

    .btn {
      min-height: 54px;
      padding: 0 20px;
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 900;
      transition: transform 0.16s, opacity 0.16s, box-shadow 0.16s;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .btn-primary {
      color: #10211d;
      background: var(--accent);
      box-shadow: 0 12px 28px rgba(54, 127, 112, 0.22);
    }

    .btn-ready {
      width: 100%;
      min-height: 66px;
      margin-top: 22px;
      color: white;
      font-size: 20px;
      background: linear-gradient(135deg, var(--accent-dark), #245b50);
      box-shadow: 0 16px 36px rgba(54, 127, 112, 0.28);
    }

    .btn-ghost {
      min-height: 42px;
      padding: 0 14px;
      color: var(--danger);
      border: 1px solid rgba(199, 51, 51, 0.22);
      background: transparent;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .counter {
      color: var(--muted);
      font-size: 15px;
      font-weight: 800;
    }

    .participants {
      min-height: 170px;
      max-height: 390px;
      overflow: auto;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 10px;
      padding: 14px;
      border: 1px dashed var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.62);
    }

    .empty {
      width: 100%;
      margin: auto;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 42px;
      padding: 0 10px 0 15px;
      border: 1px solid rgba(54, 127, 112, 0.18);
      border-radius: 999px;
      background: rgba(137, 200, 184, 0.23);
      font-size: 17px;
      font-weight: 900;
      animation: chipIn 0.22s ease-out;
    }

    .chip button {
      width: 25px;
      height: 25px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text);
      background: rgba(255, 255, 255, 0.8);
      font-size: 17px;
      line-height: 1;
    }

    @keyframes chipIn {
      from {
        opacity: 0;
        transform: scale(0.72);
      }
    }

    .raffle-screen {
      position: relative;
      min-height: 100vh;
      padding: 24px;
      display: none;
      place-items: center;
      overflow: hidden;
      color: white;
      background:
        radial-gradient(circle at center, rgba(137, 200, 184, 0.18), transparent 30%),
        linear-gradient(180deg, #171717 0%, #090909 100%);
    }

    .raffle-screen.active {
      display: grid;
    }

    .raffle-shell {
      position: relative;
      z-index: 3;
      width: min(980px, 100%);
      text-align: center;
    }

    .raffle-title {
      margin-bottom: 10px;
      font-size: clamp(34px, 5vw, 64px);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .raffle-subtitle {
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.65);
      font-weight: 800;
    }

    .drum-wrap {
      position: relative;
      width: min(520px, 88vw);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin: 0 auto 8px;
    }

    .drum-glow {
      position: absolute;
      inset: 6%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(137, 200, 184, 0.48), transparent 70%);
      filter: blur(22px);
      opacity: 0.8;
    }

    .drum {
      position: relative;
      width: 78%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 14px solid #f3f3f3;
      border-radius: 50%;
      overflow: hidden;
      background:
        repeating-conic-gradient(
          from 0deg,
          rgba(255, 255, 255, 0.28) 0deg 7deg,
          transparent 7deg 20deg
        ),
        radial-gradient(circle at 38% 30%, #c7efe5 0%, var(--accent) 42%, #3f8f7f 100%);
      box-shadow:
        inset 0 0 0 10px rgba(255, 255, 255, 0.22),
        inset 0 -26px 48px rgba(0, 0, 0, 0.2),
        0 30px 60px rgba(0, 0, 0, 0.4);
      transform-origin: center;
    }

    .drum::before,
    .drum::after {
      content: "";
      position: absolute;
      z-index: 1;
      border-radius: 50%;
    }

    .drum::before {
      width: 38px;
      height: 38px;
      background: #171717;
      box-shadow: 0 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .drum::after {
      width: 62%;
      height: 62%;
      border: 4px solid rgba(255, 255, 255, 0.35);
      background: transparent;
    }

    .drum.spinning {
      animation: spinDrum 0.24s linear infinite;
    }

    @keyframes spinDrum {
      to {
        transform: rotate(360deg);
      }
    }

    .stand {
      position: absolute;
      bottom: 1%;
      width: 72%;
      height: 21%;
      border-radius: 50% 50% 24px 24px;
      background: linear-gradient(#353535, #050505);
      box-shadow: 0 22px 35px rgba(0, 0, 0, 0.45);
    }

    .ball {
      position: absolute;
      z-index: 5;
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
      border: 8px solid #171717;
      border-radius: 50%;
      color: #171717;
      background: white;
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.32);
      font-size: clamp(34px, 7vw, 58px);
      font-weight: 1000;
      opacity: 0;
      transform: translateY(-175px) scale(0.35) rotate(-160deg);
    }

    .ball.visible {
      opacity: 1;
      animation: ballDrop 1.1s cubic-bezier(0.14, 0.86, 0.28, 1.25) both;
    }

    @keyframes ballDrop {
      0% {
        opacity: 0;
        transform: translateY(-180px) scale(0.35) rotate(-160deg);
      }
      52% {
        opacity: 1;
        transform: translateY(45px) scale(1.1) rotate(18deg);
      }
      74% {
        transform: translateY(-16px) scale(0.96) rotate(-7deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0);
      }
    }

    .winner-label {
      min-height: 34px;
      margin-bottom: 4px;
      color: rgba(255, 255, 255, 0.68);
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    .winner-number {
      min-height: 86px;
      margin: 0;
      font-size: clamp(64px, 11vw, 112px);
      line-height: 0.9;
      letter-spacing: -0.07em;
    }

    .raffle-actions {
      width: min(520px, 100%);
      margin: 26px auto 0;
      display: grid;
      gap: 12px;
    }

    .btn-spin {
      width: 100%;
      min-height: 72px;
      color: white;
      font-size: clamp(18px, 3vw, 24px);
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, var(--pink), #b92b69);
      box-shadow: 0 18px 38px rgba(239, 78, 150, 0.35);
    }

    .btn-back {
      min-height: 48px;
      color: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
    }

    .status {
      min-height: 24px;
      margin: 16px 0 0;
      color: rgba(255, 255, 255, 0.65);
      font-size: 14px;
    }

    .firework {
      position: fixed;
      z-index: 2;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
    }

    .firework-particle {
      position: fixed;
      z-index: 2;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      animation: explode 1.3s ease-out forwards;
      box-shadow: 0 0 12px currentColor;
    }

    @keyframes explode {
      from {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      to {
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(0.2);
      }
    }

    .confetti {
      position: fixed;
      top: -24px;
      z-index: 4;
      width: 11px;
      height: 20px;
      pointer-events: none;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      to {
        transform: translate3d(var(--drift), 110vh, 0) rotate(760deg);
        opacity: 0.92;
      }
    }

    @media (max-width: 700px) {
      .screen,
      .raffle-screen {
        padding: 14px;
      }

      .setup-card {
        padding: 22px;
        border-radius: 24px;
      }

      .add-form {
        grid-template-columns: 1fr;
      }

      .drum-wrap {
        width: min(420px, 94vw);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <section class="screen active" id="setupScreen">
    <div class="setup-card">
      <h1>Призовой лототрон</h1>
      <p class="subtitle">
        Добавляйте номера участников после выполнения задания.
        Когда все готовы, переходите к розыгрышу.
      </p>

      <form class="add-form" id="addForm">
        <input
          class="number-input"
          id="numberInput"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          maxlength="12"
          placeholder="Введите номер участника"
          aria-label="Номер участника"
        />
        <button class="btn btn-primary" type="submit">Добавить</button>
      </form>

      <div class="toolbar">
        <span class="counter" id="counter">Участников: 0</span>
        <button class="btn btn-ghost" id="clearButton" type="button">
          Очистить список
        </button>
      </div>

      <div class="participants" id="participants">
        <p class="empty">Пока номеров нет. Добавьте первого участника.</p>
      </div>

      <button class="btn btn-ready" id="readyButton" type="button" disabled>
        Готово
      </button>
    </div>
  </section>

  <section class="raffle-screen" id="raffleScreen">
    <div class="raffle-shell">
      <h2 class="raffle-title">Призовой лототрон</h2>
      <p class="raffle-subtitle" id="raffleCount">Участников: 0</p>

      <div class="drum-wrap">
        <div class="drum-glow"></div>
        <div class="drum" id="drum"></div>
        <div class="stand"></div>
        <div class="ball" id="ball">?</div>
      </div>

      <p class="winner-label" id="winnerLabel">Победитель</p>
      <p class="winner-number" id="winnerNumber">—</p>

      <div class="raffle-actions">
        <button class="btn btn-spin" id="spinButton" type="button">
          Выбрать победителя
        </button>

        <button class="btn btn-back" id="backButton" type="button">
          ← Назад к участникам
        </button>
      </div>

      <p class="status" id="status">Нажмите кнопку, чтобы запустить лототрон.</p>
    </div>
  </section>

  <script>
    const STORAGE_KEY = "prize-raffle-participants-v2";

    const setupScreen = document.getElementById("setupScreen");
    const raffleScreen = document.getElementById("raffleScreen");

    const addForm = document.getElementById("addForm");
    const numberInput = document.getElementById("numberInput");
    const participantsBox = document.getElementById("participants");
    const counter = document.getElementById("counter");
    const raffleCount = document.getElementById("raffleCount");
    const clearButton = document.getElementById("clearButton");
    const readyButton = document.getElementById("readyButton");

    const spinButton = document.getElementById("spinButton");
    const backButton = document.getElementById("backButton");
    const drum = document.getElementById("drum");
    const ball = document.getElementById("ball");
    const winnerNumber = document.getElementById("winnerNumber");
    const winnerLabel = document.getElementById("winnerLabel");
    const status = document.getElementById("status");

    let participants = loadParticipants();
    let isSpinning = false;

    function loadParticipants() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved.map(String) : [];
      } catch {
        return [];
      }
    }

    function saveParticipants() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(participants));
    }

    function normalizeNumber(value) {
      return value.trim().replace(/\s+/g, "");
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, (symbol) => {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        };
        return entities[symbol];
      });
    }

    function renderParticipants() {
      counter.textContent = `Участников: ${participants.length}`;
      raffleCount.textContent = `Участников: ${participants.length}`;

      readyButton.disabled = participants.length === 0 || isSpinning;
      clearButton.disabled = participants.length === 0 || isSpinning;
      spinButton.disabled = participants.length === 0 || isSpinning;

      if (participants.length === 0) {
        participantsBox.innerHTML =
          '<p class="empty">Пока номеров нет. Добавьте первого участника.</p>';
        return;
      }

      participantsBox.innerHTML = participants
        .map(
          (number) => `
            <div class="chip">
              <span>${escapeHtml(number)}</span>
              <button
                type="button"
                aria-label="Удалить номер ${escapeHtml(number)}"
                data-remove="${escapeHtml(number)}"
              >×</button>
            </div>
          `
        )
        .join("");
    }

    function addParticipant(number) {
      if (!number) {
        alert("Введите номер участника.");
        return;
      }

      if (!/^\d+$/.test(number)) {
        alert("Номер должен состоять только из цифр.");
        return;
      }

      if (participants.includes(number)) {
        alert(`Номер ${number} уже участвует.`);
        return;
      }

      participants.push(number);
      saveParticipants();
      renderParticipants();

      numberInput.value = "";
      numberInput.focus();
    }

    function removeParticipant(number) {
      participants = participants.filter((item) => item !== number);
      saveParticipants();
      renderParticipants();
    }

    function clearParticipants() {
      if (!participants.length || isSpinning) return;

      const confirmed = window.confirm("Удалить всех участников?");
      if (!confirmed) return;

      participants = [];
      saveParticipants();
      renderParticipants();
      resetWinner();
    }

    function openRaffleScreen() {
      if (!participants.length) return;

      setupScreen.classList.remove("active");
      raffleScreen.classList.add("active");
      resetWinner();
    }

    function openSetupScreen() {
      if (isSpinning) return;

      raffleScreen.classList.remove("active");
      setupScreen.classList.add("active");
      numberInput.focus();
    }

    function resetWinner() {
      winnerNumber.textContent = "—";
      winnerLabel.textContent = "Победитель";
      ball.textContent = "?";
      ball.classList.remove("visible");
      status.textContent = "Нажмите кнопку, чтобы запустить лототрон.";
    }

    function getRandomIndex(max) {
      if (window.crypto && window.crypto.getRandomValues) {
        const values = new Uint32Array(1);
        window.crypto.getRandomValues(values);
        return values[0] % max;
      }

      return Math.floor(Math.random() * max);
    }

    async function startRaffle() {
      if (!participants.length || isSpinning) return;

      isSpinning = true;
      renderParticipants();

      winnerNumber.textContent = "…";
      winnerLabel.textContent = "Лототрон крутится";
      ball.classList.remove("visible");
      drum.classList.add("spinning");
      status.textContent = "Определяем победителя...";

      const animationDuration = 4200;
      const previewInterval = 85;

      const previewTimer = setInterval(() => {
        const preview =
          participants[Math.floor(Math.random() * participants.length)];
        winnerNumber.textContent = preview;
      }, previewInterval);

      await wait(animationDuration);

      clearInterval(previewTimer);
      drum.classList.remove("spinning");

      const winner = participants[getRandomIndex(participants.length)];

      winnerLabel.textContent = "Победитель";
      winnerNumber.textContent = `№ ${winner}`;
      ball.textContent = winner;

      void ball.offsetWidth;
      ball.classList.add("visible");

      status.textContent = `Победил участник № ${winner}`;
      launchCelebration();

      isSpinning = false;
      spinButton.textContent = "Выбрать нового победителя";
      renderParticipants();
    }

    function wait(milliseconds) {
      return new Promise((resolve) => setTimeout(resolve, milliseconds));
    }

    function launchCelebration() {
      launchConfetti();

      const bursts = [
        [18, 28],
        [50, 18],
        [82, 30],
        [28, 55],
        [72, 56]
      ];

      bursts.forEach(([x, y], index) => {
        setTimeout(() => createFirework(x, y), index * 220);
      });

      setTimeout(() => createFirework(50, 38), 900);
      setTimeout(() => createFirework(20, 18), 1150);
      setTimeout(() => createFirework(80, 18), 1350);
    }

    function createFirework(xPercent, yPercent) {
      const colors = ["#89c8b8", "#ef4e96", "#ffffff", "#f2c94c", "#7db7ff"];
      const color = colors[Math.floor(Math.random() * colors.length)];
      const particleCount = 38;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement("div");
        particle.className = "firework-particle";
        particle.style.left = `${xPercent}vw`;
        particle.style.top = `${yPercent}vh`;
        particle.style.background = color;
        particle.style.color = color;

        const angle = (Math.PI * 2 * i) / particleCount;
        const distance = 70 + Math.random() * 120;

        particle.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
        particle.style.setProperty("--y", `${Math.sin(angle) * distance}px`);

        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 1500);
      }
    }

    function launchConfetti() {
      const colors = ["#89c8b8", "#ef4e96", "#171717", "#ffffff", "#f2c94c"];

      for (let i = 0; i < 120; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.setProperty("--drift", `${Math.random() * 260 - 130}px`);
        piece.style.animationDuration = `${2.5 + Math.random() * 2.5}s`;
        piece.style.animationDelay = `${Math.random() * 0.8}s`;
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;

        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 5600);
      }
    }

    addForm.addEventListener("submit", (event) => {
      event.preventDefault();
      addParticipant(normalizeNumber(numberInput.value));
    });

    participantsBox.addEventListener("click", (event) => {
      const button = event.target.closest("[data-remove]");
      if (!button || isSpinning) return;
      removeParticipant(button.dataset.remove);
    });

    clearButton.addEventListener("click", clearParticipants);
    readyButton.addEventListener("click", openRaffleScreen);
    backButton.addEventListener("click", openSetupScreen);
    spinButton.addEventListener("click", startRaffle);

    renderParticipants();
  </script>
</body>
</html>
